[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sillo-oauth"
version = "0.1.1"
description = "OAuth 2.0 / OpenID Connect login for Sillo — plain functions, no router, no middleware."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    {name = "Chidebele Dunamis", email = "techwithdunamix@gmail.com"}
]
keywords = ["sillo", "oauth", "oauth2", "oidc", "sso", "google", "github", "asgi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Typing :: Typed",
]
dependencies = [
    # Only the pure-HTTP parts of the framework are touched (Request, and the
    # HMAC helpers in sillo.helpers.crypto), so no ORM extra is required here.
    # An application that resolves profiles onto ORM-backed users installs
    # `sillo-framework[record]` itself.
    "sillo-framework>=0.0.2a1",
    "httpx>=0.23.3,<0.29.0",
]

[project.urls]
Homepage = "https://github.com/sillohq/oauth"
Repository = "https://github.com/sillohq/oauth"
Documentation = "https://sillolabs.com"
Issues = "https://github.com/sillohq/oauth/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    # The integration suite drives a real sillo app through session and JWT
    # login, which need the ORM-backed user base and PyJWT respectively.
    "sillo-framework[record,jwt]>=0.0.2a1",
]

[tool.hatch.build.targets.wheel]
packages = ["sillo_oauth"]
# py.typed has no extension, so it is not picked up by the default include
# rules and a wheel would ship without it -- leaving the Typing :: Typed
# classifier claiming something downstream checkers cannot see.
artifacts = ["sillo_oauth/py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Lets the suite run straight from a checkout, without an editable install.
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".venv", "venv", "build", "dist", "__pypackages__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["sillo_oauth"]
